# Global AdaptOS configuration.
# Secrets and service URLs come from environment variables (ADAPTOS_*), not from this file.

project: adaptos

base_model:
  name: Qwen/Qwen2.5-0.5B-Instruct                 # used for real training/serving
  revision: 7ae557604adf67be50417f59c2c2f167def9a775  # pinned model commit
  test_name: HuggingFaceTB/SmolLM2-135M-Instruct     # small model for quick experiments
  test_revision: 12fd25f77366fa6b3b4b768ec3050bf629380bac
  device: cpu
  dtype: float32
  num_threads: 6                                     # = physical CPU cores

# Pluggable backends: CPU-friendly defaults; GPU options can be switched in later.
backends:
  training: lora    # lora | qlora (qlora needs an NVIDIA GPU)
  inference: peft   # peft | vllm  (vllm needs an NVIDIA GPU)

mlflow:
  experiment_prefix: adaptos

retraining:
  executor: local          # local | aws (aws launches a temporary GPU instance per run)
  warm_start: true         # continue from the champion adapter instead of starting over
  new_data_splits: [drift_train]  # freshly labeled data for the new kind of request
  replay_ratio: 1.0        # old training examples replayed per new example (rehearsal),
                           # so the adapter does not forget what it already does well
  epochs: 2
  max_runs_per_day: 3      # hard cap per adapter, on top of the cooldown in monitor.yaml
  gateway_url: http://localhost:8000

serving:
  dtype: bfloat16          # measured on CPU: faster than float32 and ~40% less memory
  num_threads: 6
  base_max_new_tokens: 256 # for requests answered by the plain base model
  max_input_chars: 8000

router:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  embedding_revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
  registered_model: adaptos-router
  confidence_threshold: 0.6   # below this, answer with the plain base model
  min_accuracy: 0.95          # promotion gate: test accuracy a router version must reach
  strip_instruction_prob: 0.5 # train on some requests without "Summarize this ...", so the
                              # router learns from content, not from a fixed prefix
  other_dataset:              # general requests that should go to the plain base model
    hf_id: databricks/databricks-dolly-15k
    revision: bdd27f4d94b9c1f951818a7da7fd7aeea5dbff1a
    exclude_categories: [summarization]   # avoid overlap with the summarize adapter
    train_size: 800
    eval_size: 200
    test_size: 100
    seed: 42
